[package]
name = "t-exp"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
hdf5 = { package = "hdf5-metno", version = "0.12.1" }
ndarray = { version = "0.17.1", features = ["serde", "rayon"] }
ndarray-stats = "0.7"
noisy_float = { version = "0.2", features = ["serde"] }
serde = { version = "1.0" }
serde_derive = "1.0"
rmp-serde = "1.3"
itertools-num = "0.1"
statrs = { version = "0.18", features = ["rand"] }
rand = "0.8"
bio = "3.0"
getset = "0.1"
derefable = "0.1"
rayon = "1.11"
typed-builder = "0.23"
itertools = "0.14"
approx = "0.5"
ordered-float = { version = "5.3", features = ["serde"] }
csv = "1.1"
duckdb = { version = "1.3.2", features = ["bundled"] }
chrono = "0.4"
clap = { version = "4.6.0", features = ["derive"] }



[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

[profile.develop]
codegen-units = 128
inherits = "release"
lto = false

[profile.profiling]
inherits = "release"
debug = true             # Full debug info for symbols
strip = false           # Don't strip symbols

